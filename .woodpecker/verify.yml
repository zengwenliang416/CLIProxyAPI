clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 0

labels:
  location: production-80
  repo: zengwenliang416/CLIProxyAPI

when:
  - event: pull_request
  - event: push
    branch: main

concurrency:
  limit: 1
  group: cliproxyapi-verify

steps:
  - name: test-and-build
    image: golang:1.26-bookworm
    commands:
      - go test ./...
      - go build -buildvcs=false -o test-output ./cmd/server
      - test -x test-output
